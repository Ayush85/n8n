      <div style={{ background:t.bgBubbleAI, border:`1px solid ${t.accentBorder}`, borderRadius:'4px 14px 14px 14px', padding:'10px 14px', display:'flex', gap:4, alignItems:'center' }}>
        {[0,1,2].map(i=><span key={i} style={{ width:5,height:5,borderRadius:'50%',background:t.textMuted,display:'inline-block',animation:`tb 1.2s ${i*0.2}s ease-in-out infinite` }}/>)}
      </div>
    </div>
  );
}

// ── Avatar ───────────────────────────────────────────────────────────────────
function Avatar({ initials, color, size = 34 }) {
  return (
    <div style={{ width:size, height:size, borderRadius:'50%', background:color+'22', border:`1.5px solid ${color}44`, flexShrink:0, display:'flex', alignItems:'center', justifyContent:'center', fontSize:size*0.32, fontWeight:600, color, letterSpacing:0.3 }}>
      {initials}
    </div>
  );
}

// ── Status pill ──────────────────────────────────────────────────────────────
function StatusPill({ status, dark }) {
  const m = STATUS_META[status] || STATUS_META.open;
  return (
    <span style={{ fontSize:10.5, fontWeight:600, padding:'2px 7px', borderRadius:999, background: dark ? m.darkBg : m.bg, color: dark ? m.darkColor : m.color, border:`1px solid ${dark ? m.darkBorder : m.border}`, whiteSpace:'nowrap' }}>
      {m.label}
    </span>
  );
}

// ── Tag pill ─────────────────────────────────────────────────────────────────
function TagPill({ tag, dark, onRemove }) {
  const m = TAG_META[tag] || { bg:'#f1f5f9', color:'#475569', darkBg:'rgba(255,255,255,0.08)', darkColor:'#94a3b8' };
  return (
    <span style={{ fontSize:11, fontWeight:500, padding:'2px 8px', borderRadius:999, background: dark ? m.darkBg : m.bg, color: dark ? m.darkColor : m.color, display:'inline-flex', alignItems:'center', gap:4 }}>
      {tag}{onRemove && <button onClick={onRemove} style={{ background:'none', border:'none', cursor:'pointer', color:'inherit', opacity:0.6, fontSize:12, padding:0, lineHeight:1 }}>×</button>}
    </span>
  );
}

// ── Conversation list item ────────────────────────────────────────────────────
function ConvItem({ conv, active, dark, accent, onClick }) {
  const [hov, setHov] = useState(false);
  const t = getTheme(dark, accent);
  const CIcon = ChannelIcons[conv.channel];
  const ch = CHANNELS[conv.channel];
  return (
    <div onClick={onClick}
      onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)}
      style={{ padding:'11px 14px', cursor:'pointer', borderBottom:`1px solid ${t.borderLight}`, borderLeft: active ? `3px solid ${accent}` : '3px solid transparent', background: active ? t.bgActive : hov ? t.bgHover : 'transparent', transition:'all 0.12s' }}>
      <div style={{ display:'flex', gap:10, alignItems:'flex-start' }}>
        <div style={{ position:'relative', flexShrink:0 }}>
          <Avatar initials={conv.avatar} color={conv.avatarColor} size={36} />
          <div style={{ position:'absolute', bottom:-1, right:-1, width:16, height:16, borderRadius:'50%', background: dark ? t.bgPanel : '#fff', display:'flex', alignItems:'center', justifyContent:'center', boxShadow:'0 1px 3px rgba(0,0,0,0.12)' }}><CIcon /></div>
        </div>
        <div style={{ flex:1, minWidth:0 }}>
          <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:3 }}>
            <span style={{ fontSize:13, fontWeight: conv.unread > 0 ? 600 : 500, color:t.text, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap', maxWidth:140 }}>{conv.name}</span>
            <span style={{ fontSize:10.5, color:t.textMuted, flexShrink:0, marginLeft:6 }}>{conv.lastTime}</span>
          </div>
          <div style={{ fontSize:12, color:t.textDim, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap', marginBottom:5 }}>{conv.lastMsg}</div>
          <div style={{ display:'flex', alignItems:'center', gap:5, flexWrap:'wrap' }}>
            <span style={{ fontSize:10, color:ch.color, background: dark ? ch.color+'18' : ch.bg, borderRadius:4, padding:'1px 5px', fontWeight:500 }}>{ch.label}</span>
            <StatusPill status={conv.status} dark={dark} />
            {conv.unread > 0 && <span style={{ marginLeft:'auto', background:accent, color:'#fff', borderRadius:999, fontSize:10, fontWeight:700, minWidth:17, height:17, display:'flex', alignItems:'center', justifyContent:'center', padding:'0 4px' }}>{conv.unread}</span>}
          </div>
        </div>
      </div>
    </div>
  );
}

// ── Message bubble ───────────────────────────────────────────────────────────
function MsgBubble({ msg, dark, accent }) {
  const t = getTheme(dark, accent);
  const isCustomer = msg.from === 'customer';
  const isAI = msg.from === 'ai';

  if (isCustomer) {
    return (
      <div style={{ display:'flex', justifyContent:'flex-start', marginBottom:12 }}>
        <div style={{ maxWidth:'68%' }}>
          <div style={{ background: t.bgBubbleCustomer, border:`1px solid ${t.border}`, borderRadius:'4px 14px 14px 14px', padding:'10px 14px', fontSize:13.5, color:t.text, lineHeight:1.55, boxShadow:t.shadow }}>
            {msg.text}
          </div>
          <div style={{ fontSize:10.5, color:t.textMuted, marginTop:4, paddingLeft:2 }}>{msg.time}</div>
        </div>
      </div>
    );
  }

  return (
    <div style={{ display:'flex', justifyContent:'flex-end', marginBottom:12 }}>
      <div style={{ maxWidth:'68%' }}>
        <div style={{ display:'flex', alignItems:'center', justifyContent:'flex-end', gap:5, marginBottom:4 }}>
          {isAI ? (
            <span style={{ fontSize:10.5, fontWeight:600, color: dark ? '#a78bfa' : '#7c3aed', background: dark ? 'rgba(167,139,250,0.12)' : '#f3f0ff', borderRadius:999, padding:'1px 7px', display:'inline-flex', alignItems:'center', gap:3 }}>
              {icons.sparkle(dark?'#a78bfa':'#7c3aed',9)} AI
            </span>
          ) : (
            <span style={{ fontSize:10.5, fontWeight:500, color: dark ? '#34d399' : '#059669' }}>{msg.agentName || 'Agent'}</span>
          )}
          <span style={{ fontSize:10.5, color:t.textMuted }}>{msg.time}</span>
          {icons.check(t.textMuted)}
        </div>
        <div style={{ background: isAI ? t.bgBubbleAI : t.bgBubbleAgent, border: isAI ? `1px solid ${dark?'rgba(139,92,246,0.2)':'rgba(139,92,246,0.15)'}` : `1px solid ${accent}30`, borderRadius:'14px 4px 14px 14px', padding:'10px 14px', fontSize:13.5, color:t.text, lineHeight:1.55, boxShadow:t.shadow }}>
          {msg.text}
        </div>
      </div>
    </div>
  );
}

// ── Main App ─────────────────────────────────────────────────────────────────
function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const dark = tweaks.darkMode;
  const accent = tweaks.accentColor;
  const t = getTheme(dark, accent);

  const [activeId, setActiveId] = useState(1);
  const [filter, setFilter] = useState('All');
  const [search, setSearch] = useState('');
  const [input, setInput] = useState('');
  const [convs, setConvs] = useState(CONVERSATIONS);
  const [isTyping, setIsTyping] = useState(false);
  const [notesMap, setNotesMap] = useState({});
  const [navActive, setNavActive] = useState('inbox');
  const [aiSuggest, setAiSuggest] = useState('');
  const msgContRef = useRef(null);
  const inputRef = useRef(null);

  const active = convs.find(c => c.id === activeId);

  const filtered = convs.filter(c => {
    const q = search.toLowerCase();
    if (q && !c.name.toLowerCase().includes(q) && !c.lastMsg.toLowerCase().includes(q)) return false;
    if (filter === 'Unread') return c.unread > 0;
    if (filter === 'Mine') return c.assignedTo === 'Alex R.';
    if (filter === 'Unassigned') return c.assignedTo === 'Unassigned';
    return true;
  });

  useEffect(() => {
    if (msgContRef.current) msgContRef.current.scrollTop = msgContRef.current.scrollHeight;
  }, [activeId, convs, isTyping]);

  const handleSelect = (id) => {
    setActiveId(id);
    setAiSuggest('');
    setConvs(prev => prev.map(c => c.id === id ? {...c, unread:0} : c));
  };

  const handleSend = () => {
    if (!input.trim()) return;
    const msg = { id: Date.now(), from:'agent', text:input, time:'Just now', agentName:'Alex R.' };
    setConvs(prev => prev.map(c => c.id !== activeId ? c : {...c, messages:[...c.messages, msg], lastMsg:input, lastTime:'Just now'}));
    setInput(''); setAiSuggest('');
    setTimeout(()=>setIsTyping(true), 700);
    setTimeout(()=>setIsTyping(false), 3000);
  };

  const handleSuggest = () => {
    const suggestions = [
      "Of course! I'd be happy to help with that. Let me look into it right away and get back to you.",
      "Absolutely! We offer a 14-day free trial with full access to all Pro features — no credit card required.",
      "Thank you for the details. I've flagged this for immediate attention and our team will follow up within the hour.",
    ];
    const s = suggestions[Math.floor(Math.random() * suggestions.length)];
    setInput(s); setAiSuggest(s);
    inputRef.current?.focus();
  };

  const quickReplies = ["Thanks for reaching out!", "Looking into this now", "Resolved ✓", "Let me check", "Can you share more details?"];

  const totalUnread = convs.reduce((s,c) => s + c.unread, 0);

  const navItems = [
    { id:'dashboard', icon: icons.dashboard },
    { id:'inbox',     icon: icons.inbox,    badge: totalUnread > 0 ? totalUnread : null },
    { id:'contacts',  icon: icons.contacts },
    { id:'tags',      icon: icons.tags },
    { id:'reports',   icon: icons.reports },
  ];

  return (
    <div style={{ display:'flex', height:'100vh', width:'100vw', background:t.bg, fontSize:tweaks.fontSize, fontFamily:"'Inter', sans-serif", color:t.text }}>
      <style>{`
        @keyframes tb { 0%,60%,100%{transform:translateY(0);opacity:.4} 30%{transform:translateY(-4px);opacity:1} }
        @keyframes fadeUp { from{opacity:0;transform:translateY(5px)} to{opacity:1;transform:translateY(0)} }
        .msg-row { animation: fadeUp 0.18s ease-out both; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: ${t.scrollbar}; border-radius: 4px; }
        * { scrollbar-width: thin; scrollbar-color: ${t.scrollbar} transparent; }
        .conv-input:focus { outline: none; }
        .search-input:focus { outline: none; }
        .quick-chip:hover { opacity: 0.8; }
      `}</style>

      {/* ── NAV RAIL ── */}
      <div style={{ width:56, background:t.navBg, display:'flex', flexDirection:'column', alignItems:'center', paddingTop:14, gap:4, flexShrink:0, zIndex:10 }}>
        {/* Logo */}
        <div style={{ width:32, height:32, borderRadius:9, background:`linear-gradient(135deg,${accent},${accent}bb)`, display:'flex', alignItems:'center', justifyContent:'center', marginBottom:16, flexShrink:0 }}>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="white"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
        </div>
        {navItems.map(n => (
          <button key={n.id} onClick={()=>setNavActive(n.id)} title={n.id} style={{ width:38, height:38, borderRadius:9, border:'none', cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center', background: navActive===n.id ? accent+'33' : 'transparent', position:'relative', transition:'background 0.15s' }}>
            {n.icon(navActive===n.id ? (dark?'#fff':accent) : t.navIcon)}
            {n.badge && <span style={{ position:'absolute', top:4, right:4, background:accent, color:'#fff', borderRadius:999, fontSize:8.5, fontWeight:700, minWidth:14, height:14, display:'flex', alignItems:'center', justifyContent:'center', padding:'0 2px' }}>{n.badge}</span>}
          </button>
        ))}
        <div style={{ flex:1 }} />
        <button onClick={()=>setNavActive('settings')} title="Settings" style={{ width:38, height:38, borderRadius:9, border:'none', cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center', background:'transparent', marginBottom:8 }}>
          {icons.settings(t.navIcon)}
        </button>
        <div style={{ width:28, height:28, borderRadius:'50%', background:'linear-gradient(135deg,#0f766e,#0d9488)', display:'flex', alignItems:'center', justifyContent:'center', fontSize:10, fontWeight:700, color:'#fff', marginBottom:12, flexShrink:0 }}>AR</div>
      </div>

      {/* ── INBOX SIDEBAR ── */}
      <div style={{ width:300, minWidth:300, background:t.bgSidebar, borderRight:`1px solid ${t.border}`, display:'flex', flexDirection:'column', flexShrink:0 }}>
        {/* Header */}
        <div style={{ padding:'16px 16px 10px', borderBottom:`1px solid ${t.border}` }}>
          <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:12 }}>
            <h2 style={{ fontSize:17, fontWeight:700, color:t.text }}>Inbox</h2>
            <button style={{ background:'none', border:'none', cursor:'pointer', color:t.textMuted, display:'flex', alignItems:'center', gap:4, fontSize:12 }}>{icons.filter(t.textMuted)}</button>
          </div>
          {/* Search */}
          <div style={{ position:'relative', marginBottom:10 }}>
            <div style={{ position:'absolute', left:10, top:'50%', transform:'translateY(-50%)', pointerEvents:'none' }}>{icons.search(t.textMuted)}</div>
            <input className="search-input" value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search conversations..." style={{ width:'100%', background:t.bgInput, border:`1px solid ${t.border}`, borderRadius:8, padding:'7px 10px 7px 30px', fontSize:12.5, color:t.text, fontFamily:'inherit' }} />
          </div>
          {/* Tabs */}
          <div style={{ display:'flex', gap:4 }}>
            {['All','Unread','Mine','Unassigned'].map(f => (
              <button key={f} onClick={()=>setFilter(f)} style={{ flex:1, padding:'5px 0', borderRadius:6, border: filter===f ? `1px solid ${accent}44` : '1px solid transparent', background: filter===f ? t.bgActive : 'transparent', color: filter===f ? accent : t.textMuted, fontSize:11, fontWeight: filter===f ? 600 : 400, cursor:'pointer', fontFamily:'inherit', transition:'all 0.12s' }}>
                {f}
                {f==='All' && <span style={{ marginLeft:4, background: filter==='All' ? accent : t.border, color: filter==='All' ? '#fff' : t.textMuted, borderRadius:999, fontSize:9.5, fontWeight:700, padding:'0 4px' }}>{convs.length}</span>}
              </button>
            ))}
          </div>
        </div>
        {/* Sort label */}
        <div style={{ padding:'8px 14px 4px', display:'flex', alignItems:'center', justifyContent:'space-between' }}>
          <span style={{ fontSize:11.5, color:t.textMuted }}>Sort by: <strong style={{ color:t.textDim }}>Latest</strong></span>
        </div>
        {/* List */}
        <div style={{ flex:1, overflowY:'auto' }}>
          {filtered.map(c => <ConvItem key={c.id} conv={c} active={activeId===c.id} dark={dark} accent={accent} onClick={()=>handleSelect(c.id)} />)}
        </div>
      </div>

      {/* ── MAIN CHAT ── */}
      <div style={{ flex:1, display:'flex', flexDirection:'column', minWidth:0, minHeight:0, background:t.bg }}>

        {/* Chat header */}
        <div style={{ height:60, padding:'0 20px', borderBottom:`1px solid ${t.border}`, display:'flex', alignItems:'center', justifyContent:'space-between', background:t.bgPanel, flexShrink:0 }}>
          <div style={{ display:'flex', alignItems:'center', gap:12 }}>
            <Avatar initials={active?.avatar} color={active?.avatarColor} size={36} />
            <div>
              <div style={{ display:'flex', alignItems:'center', gap:8 }}>
                <span style={{ fontSize:14.5, fontWeight:700, color:t.text }}>{active?.name}</span>
                {isTyping && (
                  <span style={{ fontSize:11.5, color:'#22c55e', background: dark?'rgba(34,197,94,0.12)':'#f0fdf4', border:'1px solid #bbf7d0', borderRadius:999, padding:'2px 9px', display:'flex', alignItems:'center', gap:5 }}>
                    <span style={{ width:6, height:6, borderRadius:'50%', background:'#22c55e', display:'inline-block', animation:'tb 1.2s ease-in-out infinite' }} /> typing…
                  </span>
                )}
              </div>
              <div style={{ fontSize:11.5, color:t.textMuted }}>{active?.handle} · <span style={{ color:CHANNELS[active?.channel]?.color }}>{CHANNELS[active?.channel]?.label}</span></div>
            </div>
          </div>
          <div style={{ display:'flex', alignItems:'center', gap:8 }}>
            <StatusPill status={active?.status} dark={dark} />
            <div style={{ width:1, height:20, background:t.border }} />
            {['active','pending','resolved','urgent'].map(s => (
              <button key={s} onClick={()=>setConvs(prev=>prev.map(c=>c.id===activeId?{...c,status:s}:c))} style={{ padding:'4px 9px', borderRadius:6, border:`1px solid ${t.border}`, background: active?.status===s ? t.bgActive : 'transparent', color: active?.status===s ? accent : t.textDim, fontSize:11, cursor:'pointer', fontFamily:'inherit', textTransform:'capitalize', transition:'all 0.12s' }}>{s}</button>
            ))}
          </div>
        </div>

        {/* Messages */}
        <div ref={msgContRef} style={{ flex:1, overflowY:'auto', padding:'20px 24px 12px', minHeight:0 }}>
          {active?.messages.map((msg,i) => (
            <div key={msg.id} className="msg-row" style={{ animationDelay:`${i*0.03}s` }}>
              <MsgBubble msg={msg} dark={dark} accent={accent} />
            </div>
          ))}
          {isTyping && <TypingDots t={t} />}
        </div>

        {/* AI suggestion strip */}
        {aiSuggest && (
          <div style={{ margin:'0 20px 8px', background: dark?'rgba(91,94,244,0.1)':'#f3f0ff', border:`1px solid ${dark?accent+'30':accent+'30'}`, borderRadius:10, padding:'9px 13px', display:'flex', gap:8, alignItems:'flex-start' }}>
            {icons.sparkle(accent)}
            <span style={{ fontSize:12, color: dark?'#c4b5fd':'#7c3aed', flex:1, lineHeight:1.5 }}>{aiSuggest}</span>
            <button onClick={()=>setAiSuggest('')} style={{ background:'none', border:'none', cursor:'pointer', color:t.textMuted, fontSize:15, padding:0, lineHeight:1 }}>×</button>
          </div>
        )}

        {/* Quick replies */}
        <div style={{ padding:'0 20px 8px', display:'flex', gap:6, flexWrap:'wrap' }}>
          <span style={{ fontSize:11.5, color:t.textMuted, alignSelf:'center', marginRight:2 }}>Quick replies:</span>
          {quickReplies.map(qr => (
            <button key={qr} className="quick-chip" onClick={()=>setInput(qr)} style={{ fontSize:11.5, padding:'4px 10px', borderRadius:999, background: dark?t.bgInput:t.pillBg, border:`1px solid ${t.border}`, color:t.textDim, cursor:'pointer', fontFamily:'inherit', transition:'opacity 0.12s' }}>{qr}</button>
          ))}
        </div>

        {/* Input area */}
        <div style={{ padding:'0 20px 18px', flexShrink:0 }}>
          <div style={{ background:t.bgPanel, border:`1.5px solid ${t.border}`, borderRadius:12, overflow:'hidden', boxShadow:t.shadow }}>
            <textarea ref={inputRef} className="conv-input" value={input} onChange={e=>setInput(e.target.value)}
              onKeyDown={e=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();handleSend();} }}
              placeholder={`Type your message…`} rows={2}
              style={{ width:'100%', background:'transparent', border:'none', padding:'12px 14px 6px', fontSize:13.5, color:t.text, fontFamily:'inherit', resize:'none', outline:'none', lineHeight:1.5, maxHeight:100, overflowY:'auto' }}
            />
            <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', padding:'6px 10px 8px' }}>
              <div style={{ display:'flex', gap:2 }}>
                {[icons.attach, icons.emoji, icons.mention].map((ic,i) => (
                  <button key={i} style={{ width:30, height:30, borderRadius:7, border:'none', background:'transparent', cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center', color:t.textMuted, transition:'background 0.1s' }} onMouseEnter={e=>e.currentTarget.style.background=t.bgHover} onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
                    {ic(t.textMuted)}
                  </button>
                ))}
                <div style={{ width:1, height:20, background:t.border, alignSelf:'center', margin:'0 4px' }} />
                <button onClick={handleSuggest} style={{ height:28, padding:'0 10px', borderRadius:7, border:`1px solid ${accent}44`, background: dark?accent+'18':accent+'12', color:accent, fontSize:11.5, fontWeight:600, cursor:'pointer', fontFamily:'inherit', display:'flex', alignItems:'center', gap:5, transition:'background 0.12s' }}>
                  {icons.sparkle(accent,11)} AI Assist
                </button>
              </div>
              <div style={{ display:'flex', alignItems:'center', gap:8 }}>
                <div style={{ display:'flex', alignItems:'center', gap:6, background:t.bgInput, border:`1px solid ${t.border}`, borderRadius:7, padding:'4px 8px' }}>
                  <span style={{ fontSize:11.5, color:t.textDim, fontWeight:500 }}>Reply</span>
                  {icons.chevron(t.textMuted)}
                </div>
                <button onClick={handleSend} style={{ height:34, padding:'0 18px', borderRadius:8, border:'none', background: input.trim() ? `linear-gradient(135deg,${accent},${accent}cc)` : t.bgInput, color: input.trim() ? '#fff' : t.textMuted, fontSize:13, fontWeight:600, cursor: input.trim() ? 'pointer' : 'default', fontFamily:'inherit', display:'flex', alignItems:'center', gap:7, boxShadow: input.trim() ? `0 3px 10px ${accent}44` : 'none', transition:'all 0.15s' }}>
                  {icons.send(input.trim()?'#fff':t.textMuted)} Send
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>

      {/* ── RIGHT PANEL ── */}
      <div style={{ width:268, minWidth:268, background:t.bgPanel, borderLeft:`1px solid ${t.border}`, display:'flex', flexDirection:'column', overflowY:'auto', flexShrink:0 }}>
        {/* Customer header */}
        <div style={{ padding:'18px 16px 14px', borderBottom:`1px solid ${t.border}` }}>
          <div style={{ fontSize:12, fontWeight:700, color:t.textMuted, textTransform:'uppercase', letterSpacing:0.7, marginBottom:12 }}>Customer Details</div>
          <div style={{ display:'flex', gap:10, alignItems:'center', marginBottom:12 }}>
            <Avatar initials={active?.avatar} color={active?.avatarColor} size={42} />
            <div>
              <div style={{ fontSize:14, fontWeight:700, color:t.text }}>{active?.name}</div>
              <div style={{ fontSize:11.5, color:t.textMuted }}>Active customer</div>
            </div>
          </div>
          {[
            { icon:'✉', val: active?.handle },
            { icon:'📱', val: CHANNELS[active?.channel]?.label },
            { icon:'🕐', val: 'Customer since Jan 2024' },
          ].map((row,i)=>(
            <div key={i} style={{ display:'flex', alignItems:'center', gap:8, marginBottom:6 }}>
              <span style={{ fontSize:12 }}>{row.icon}</span>
              <span style={{ fontSize:12, color:t.textDim }}>{row.val}</span>
            </div>
          ))}
        </div>

        {/* Assigned Agent */}
        <div style={{ padding:'12px 16px', borderBottom:`1px solid ${t.border}` }}>
          <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:8 }}>
            <span style={{ fontSize:11.5, fontWeight:700, color:t.textMuted, textTransform:'uppercase', letterSpacing:0.6 }}>Assigned Agent</span>
            <button style={{ fontSize:11.5, color:accent, fontWeight:600, background:'none', border:'none', cursor:'pointer', fontFamily:'inherit' }}>Change</button>
          </div>
          <div style={{ display:'flex', alignItems:'center', gap:8, padding:'8px 10px', background:t.bgInput, border:`1px solid ${t.border}`, borderRadius:8 }}>
            <div style={{ width:28, height:28, borderRadius:'50%', background:'linear-gradient(135deg,#0f766e,#0d9488)', display:'flex', alignItems:'center', justifyContent:'center', fontSize:10, fontWeight:700, color:'#fff', flexShrink:0 }}>AR</div>
            <div>
              <div style={{ fontSize:12.5, fontWeight:600, color:t.text }}>{active?.assignedTo !== 'Unassigned' ? active?.assignedTo : '—'}</div>
              <div style={{ fontSize:11, color:'#22c55e', display:'flex', alignItems:'center', gap:4 }}>
                <span style={{ width:5, height:5, borderRadius:'50%', background:'#22c55e', display:'inline-block' }} /> Online
              </div>
            </div>
          </div>
        </div>

        {/* Status */}
        <div style={{ padding:'12px 16px', borderBottom:`1px solid ${t.border}` }}>
          <div style={{ fontSize:11.5, fontWeight:700, color:t.textMuted, textTransform:'uppercase', letterSpacing:0.6, marginBottom:8 }}>Status</div>
          <div style={{ display:'flex', flexDirection:'column', gap:5 }}>
            {Object.entries(STATUS_META).map(([key, m]) => (
              <button key={key} onClick={()=>setConvs(prev=>prev.map(c=>c.id===activeId?{...c,status:key}:c))} style={{ padding:'7px 12px', borderRadius:8, border:`1px solid ${active?.status===key ? (dark?m.darkBorder:m.border) : t.border}`, background: active?.status===key ? (dark?m.darkBg:m.bg) : 'transparent', color: active?.status===key ? (dark?m.darkColor:m.color) : t.textDim, fontSize:12.5, fontWeight: active?.status===key ? 600 : 400, cursor:'pointer', fontFamily:'inherit', textAlign:'left', transition:'all 0.12s' }}>
                {m.label}
              </button>
            ))}
          </div>
        </div>

        {/* Tags */}
        <div style={{ padding:'12px 16px', borderBottom:`1px solid ${t.border}` }}>
          <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:8 }}>
            <span style={{ fontSize:11.5, fontWeight:700, color:t.textMuted, textTransform:'uppercase', letterSpacing:0.6 }}>Tags</span>
            <button style={{ fontSize:11.5, color:accent, fontWeight:600, background:'none', border:'none', cursor:'pointer', fontFamily:'inherit' }}>+ Add</button>
          </div>
          <div style={{ display:'flex', flexWrap:'wrap', gap:5 }}>
            {active?.tags.map(tag=>(
              <TagPill key={tag} tag={tag} dark={dark}
                onRemove={()=>setConvs(prev=>prev.map(c=>c.id===activeId?{...c,tags:c.tags.filter(t=>t!==tag)}:c))} />
            ))}
          </div>
        </div>

        {/* AI Summary */}
        <div style={{ padding:'12px 16px', borderBottom:`1px solid ${t.border}` }}>
          <div style={{ display:'flex', alignItems:'center', gap:5, marginBottom:8 }}>
            {icons.sparkle(accent)}
            <span style={{ fontSize:11.5, fontWeight:700, color:t.textMuted, textTransform:'uppercase', letterSpacing:0.6 }}>AI Summary</span>
          </div>
          <div style={{ fontSize:12, color:t.textDim, lineHeight:1.6, background: dark?accent+'0d':accent+'08', border:`1px solid ${accent}22`, borderRadius:8, padding:'8px 10px' }}>
            {active?.tags?.includes('Lead') ? 'Qualified lead with high purchase intent. Asking about pricing. Recommend demo offer.' : 'Support case requiring follow-up. Customer issue still unresolved. Consider escalation.'}
          </div>
        </div>

        {/* Notes */}
        <div style={{ padding:'12px 16px', flex:1 }}>
          <div style={{ display:'flex', alignItems:'center', gap:6, marginBottom:8 }}>
            {icons.note(t.textMuted)}
            <span style={{ fontSize:11.5, fontWeight:700, color:t.textMuted, textTransform:'uppercase', letterSpacing:0.6 }}>Internal Notes</span>
            <span style={{ marginLeft:'auto', fontSize:9.5, background:t.bgInput, border:`1px solid ${t.border}`, borderRadius:4, padding:'1px 5px', color:t.textMuted }}>Private</span>
          </div>
          <textarea value={notesMap[activeId]??active?.notes??''} onChange={e=>setNotesMap(p=>({...p,[activeId]:e.target.value}))}
            placeholder="Add private notes…" style={{ width:'100%', minHeight:80, background:t.bgInput, border:`1px solid ${t.border}`, borderRadius:8, padding:'8px 10px', color:t.text, fontSize:12, fontFamily:'inherit', resize:'none', outline:'none', lineHeight:1.6 }} />
        </div>
      </div>

      {/* ── TWEAKS ── */}
      <TweaksPanel>
        <TweakSection label="Theme">
          <TweakToggle label="Dark mode" value={tweaks.darkMode} onChange={v=>setTweak('darkMode',v)} />
        </TweakSection>
        <TweakSection label="Accent color">
          <TweakColor label="Color" value={tweaks.accentColor} onChange={v=>setTweak('accentColor',v)} />
        </TweakSection>
        <TweakSection label="Typography">
          <TweakSlider label="Font size" value={tweaks.fontSize} min={11} max={16} step={0.5} unit="px" onChange={v=>setTweak('fontSize',v)} />
        </TweakSection>
      </TweaksPanel>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
